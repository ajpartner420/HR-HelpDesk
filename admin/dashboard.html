<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard | HR Helpdesk</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #07111f,
                    #0b2940,
                    #06101e
                );
        }

        body.light {
            color: #172033;

            background:
                linear-gradient(
                    135deg,
                    #eef7ff,
                    #dceeff,
                    #f7fbff
                );
        }

        .orb {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .3;
            z-index: -1;
        }

        .orb1 {
            background: #00c6ff;
            top: -100px;
            left: -100px;
        }

        .orb2 {
            background: #0066ff;
            right: -100px;
            bottom: -100px;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 250px;
            padding: 25px 18px;

            border-right:
                1px solid rgba(255,255,255,.12);

            background:
                rgba(255,255,255,.06);

            backdrop-filter: blur(20px);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 40px;
            padding-left: 10px;
        }

        .logo span {
            color: #00c6ff;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu a {
            padding: 14px;
            border-radius: 12px;

            text-decoration: none;
            color: inherit;

            transition: .25s;
        }

        .menu a:hover,
        .menu a.active {
            background:
                rgba(0,198,255,.16);

            color: #00c6ff;
        }

        .logout {
            margin-top: 35px;
            color: #ff6b6b !important;
        }

        /* MAIN */

        .main {
            flex: 1;
            padding: 28px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 30px;
        }

        .welcome h1 {
            margin: 0 0 7px;
            font-size: 28px;
        }

        .welcome p {
            margin: 0;
            opacity: .65;
        }

        .theme-btn {
            width: 45px;
            height: 45px;

            border-radius: 12px;

            border:
                1px solid rgba(255,255,255,.15);

            background:
                rgba(255,255,255,.08);

            color: inherit;

            cursor: pointer;
            font-size: 18px;
        }

        /* STATS */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;

            margin-bottom: 25px;
        }

        .card {
            background:
                rgba(255,255,255,.07);

            border:
                1px solid rgba(255,255,255,.13);

            border-radius: 18px;

            padding: 22px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 15px 40px rgba(0,0,0,.15);
        }

        body.light .card,
        body.light .sidebar,
        body.light .theme-btn {
            background:
                rgba(255,255,255,.6);

            border-color:
                rgba(0,0,0,.08);
        }

        .stat-title {
            opacity: .65;
            font-size: 14px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            margin-top: 10px;
        }

        .blue {
            color: #00c6ff;
        }

        .yellow {
            color: #ffc857;
        }

        .green {
            color: #38e38b;
        }

        .red {
            color: #ff6b6b;
        }

        /* TICKETS */

        .tickets-card {
            overflow-x: auto;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .card-header h2 {
            margin: 0;
            font-size: 19px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th,
        td {
            text-align: left;
            padding: 14px 10px;

            border-bottom:
                1px solid rgba(255,255,255,.08);
        }

        th {
            font-size: 12px;
            opacity: .6;
            text-transform: uppercase;
        }

        td {
            font-size: 14px;
        }

        .ticket-id {
            color: #00c6ff;
            font-weight: bold;
        }

        .priority {
            font-size: 12px;
            padding: 5px 9px;
            border-radius: 15px;
        }

        .priority.High {
            background: rgba(255,107,107,.15);
            color: #ff6b6b;
        }

        .priority.Medium {
            background: rgba(255,200,87,.15);
            color: #ffc857;
        }

        .priority.Low {
            background: rgba(56,227,139,.15);
            color: #38e38b;
        }

        select.status-select {
            padding: 8px;

            border-radius: 9px;

            border:
                1px solid rgba(255,255,255,.15);

            background:
                rgba(255,255,255,.08);

            color: inherit;

            cursor: pointer;
        }

        select.status-select option {
            color: #111;
        }

        .empty {
            text-align: center;
            padding: 50px;
            opacity: .65;
        }

        @media(max-width: 1000px) {

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media(max-width: 700px) {

            .sidebar {
                width: 80px;
            }

            .logo {
                font-size: 0;
                text-align: center;
            }

            .logo span {
                font-size: 20px;
            }

            .menu a {
                font-size: 0;
                text-align: center;
            }

            .main {
                padding: 18px;
            }

        }

        @media(max-width: 550px) {

            .layout {
                display: block;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom:
                    1px solid rgba(255,255,255,.12);
            }

            .menu {
                flex-direction: row;
                overflow-x: auto;
            }

            .menu a {
                white-space: nowrap;
                font-size: 13px;
            }

            .logout {
                margin-top: 0;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .welcome h1 {
                font-size: 22px;
            }

        }

    </style>

</head>


<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>


<div class="layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            HR <span>Admin</span>
        </div>


        <nav class="menu">

            <a
                href="dashboard.html"
                class="active"
            >
                📊 Dashboard
            </a>

            <a href="#tickets">
                🎫 All Tickets
            </a>

            <a href="#">
                👥 Employees
            </a>

            <a href="#">
                📄 HR Policies
            </a>

            <a href="#">
                ⚙️ Settings
            </a>

            <a
                href="#"
                class="logout"
                onclick="logout()"
            >
                🚪 Logout
            </a>

        </nav>

    </aside>


    <!-- MAIN -->

    <main class="main">


        <div class="topbar">

            <div class="welcome">

                <h1>
                    Admin Dashboard 🛠️
                </h1>

                <p>
                    Manage employee HR support tickets.
                </p>

            </div>


            <button
                class="theme-btn"
                id="themeBtn"
                onclick="toggleTheme()"
            >
                ☀️
            </button>

        </div>


        <!-- STATS -->

        <section class="stats">


            <div class="card">

                <div class="stat-title">
                    Total Tickets
                </div>

                <div
                    id="totalTickets"
                    class="stat-number blue"
                >
                    0
                </div>

            </div>


            <div class="card">

                <div class="stat-title">
                    Open
                </div>

                <div
                    id="openTickets"
                    class="stat-number red"
                >
                    0
                </div>

            </div>


            <div class="card">

                <div class="stat-title">
                    Pending
                </div>

                <div
                    id="pendingTickets"
                    class="stat-number yellow"
                >
                    0
                </div>

            </div>


            <div class="card">

                <div class="stat-title">
                    Resolved
                </div>

                <div
                    id="resolvedTickets"
                    class="stat-number green"
                >
                    0
                </div>

            </div>


        </section>


        <!-- ALL TICKETS -->

        <section
            id="tickets"
            class="card tickets-card"
        >

            <div class="card-header">

                <h2>
                    🎫 All Employee Tickets
                </h2>

            </div>


            <div id="ticketTable"></div>

        </section>


    </main>

</div>


<script>

    /* ============================
       ADMIN LOGIN CHECK
    ============================ */

    if (
        localStorage.getItem("hr-user-role")
        !== "admin"
    ) {

        window.location.href =
            "../index.html";

    }


    /* ============================
       THEME
    ============================ */

    const savedTheme =
        localStorage.getItem("hr-theme");


    if (savedTheme === "light") {

        document.body.classList.add("light");

        document.getElementById(
            "themeBtn"
        ).textContent = "🌙";

    }


    function toggleTheme() {

        document.body.classList.toggle("light");


        const isLight =
            document.body.classList.contains("light");


        localStorage.setItem(
            "hr-theme",
            isLight ? "light" : "dark"
        );


        document.getElementById(
            "themeBtn"
        ).textContent =
            isLight ? "🌙" : "☀️";

    }


    /* ============================
       LOAD TICKETS
    ============================ */

    function getTickets() {

        return JSON.parse(
            localStorage.getItem("hr-tickets")
            || "[]"
        );

    }


    /* ============================
       UPDATE STATS
    ============================ */

    function updateStats(tickets) {

        document.getElementById(
            "totalTickets"
        ).textContent = tickets.length;


        document.getElementById(
            "openTickets"
        ).textContent =
            tickets.filter(
                ticket => ticket.status === "Open"
            ).length;


        document.getElementById(
            "pendingTickets"
        ).textContent =
            tickets.filter(
                ticket => ticket.status === "Pending"
            ).length;


        document.getElementById(
            "resolvedTickets"
        ).textContent =
            tickets.filter(
                ticket => ticket.status === "Resolved"
            ).length;

    }


    /* ============================
       DISPLAY TICKETS
    ============================ */

    function displayTickets() {

        const tickets = getTickets();

        updateStats(tickets);


        const container =
            document.getElementById(
                "ticketTable"
            );


        if (tickets.length === 0) {

            container.innerHTML = `
                <div class="empty">

                    <div style="font-size:50px;">
                        🎫
                    </div>

                    <h3>
                        No tickets yet
                    </h3>

                    <p>
                        Employee tickets will appear here.
                    </p>

                </div>
            `;

            return;

        }


        let html = `

            <table>

                <thead>

                    <tr>

                        <th>Ticket</th>

                        <th>Subject</th>

                        <th>Category</th>

                        <th>Priority</th>

                        <th>Created</th>

                        <th>Status</th>

                    </tr>

                </thead>

                <tbody>
        `;


        tickets.forEach((ticket, index) => {

            html += `

                <tr>

                    <td>
                        <span class="ticket-id">
                            ${escapeHtml(ticket.id)}
                        </span>
                    </td>


                    <td>
                        ${escapeHtml(ticket.subject)}
                    </td>


                    <td>
                        ${escapeHtml(ticket.category)}
                    </td>


                    <td>

                        <span
                            class="priority ${escapeHtml(ticket.priority)}"
                        >
                            ${escapeHtml(ticket.priority)}
                        </span>

                    </td>


                    <td>
                        ${escapeHtml(ticket.createdAt)}
                    </td>


                    <td>

                        <select
                            class="status-select"
                            onchange="changeStatus(${index}, this.value)"
                        >

                            <option
                                ${ticket.status === "Open" ? "selected" : ""}
                            >
                                Open
                            </option>

                            <option
                                ${ticket.status === "Pending" ? "selected" : ""}
                            >
                                Pending
                            </option>

                            <option
                                ${ticket.status === "Resolved" ? "selected" : ""}
                            >
                                Resolved
                            </option>

                        </select>

                    </td>

                </tr>

            `;

        });


        html += `
                </tbody>
            </table>
        `;


        container.innerHTML = html;

    }


    /* ============================
       CHANGE STATUS
    ============================ */

    function changeStatus(index, newStatus) {

        const tickets = getTickets();


        if (!tickets[index]) {
            return;
        }


        tickets[index].status =
            newStatus;


        localStorage.setItem(
            "hr-tickets",
            JSON.stringify(tickets)
        );


        displayTickets();

    }


    /* ============================
       SECURITY HELPER
    ============================ */

    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }


    /* ============================
       LOGOUT
    ============================ */

    function logout() {

        localStorage.removeItem(
            "hr-user-role"
        );

        window.location.href =
            "../index.html";

    }


    displayTickets();

</script>

</body>

</html>
