<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard | HR Helpdesk</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #07111f,
                    #0b2940,
                    #06101e
                );
        }

        body.light {
            color: #172033;

            background:
                linear-gradient(
                    135deg,
                    #eef7ff,
                    #dceeff,
                    #f7fbff
                );
        }

        .orb {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .3;
            z-index: -1;
        }

        .orb1 {
            background: #00c6ff;
            top: -100px;
            left: -100px;
        }

        .orb2 {
            background: #0066ff;
            right: -100px;
            bottom: -100px;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 250px;
            padding: 25px 18px;

            border-right:
                1px solid rgba(255,255,255,.12);

            background:
                rgba(255,255,255,.06);

            backdrop-filter: blur(20px);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 40px;
            padding-left: 10px;
        }

        .logo span {
            color: #00c6ff;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu a {
            padding: 14px;
            border-radius: 12px;

            text-decoration: none;
            color: inherit;

            transition: .25s;
        }

        .menu a:hover,
        .menu a.active {
            background:
                rgba(0,198,255,.16);

            color: #00c6ff;
        }

        .logout {
            margin-top: 35px;
            color: #ff6b6b !important;
        }

        /* MAIN */

        .main {
            flex: 1;
            padding: 28px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 30px;
        }

        .welcome h1 {
            margin: 0 0 7px;
            font-size: 28px;
        }

        .welcome p {
            margin: 0;
            opacity: .65;
        }

        .theme-btn {
            width: 45px;
            height: 45px;

            border-radius: 12px;

            border:
                1px solid rgba(255,255,255,.15);

            background:
                rgba(255,255,255,.08);

            color: inherit;

            cursor: pointer;
            font-size: 18px;
        }

        /* STATS */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;

            margin-bottom: 25px;
        }

        .card {
            background:
                rgba(255,255,255,.07);

            border:
                1px solid rgba(255,255,255,.13);

            border-radius: 18px;

            padding: 22px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 15px 40px rgba(0,0,0,.15);
        }

        body.light .card,
        body.light .sidebar,
        body.light .theme-btn {
            background:
                rgba(255,255,255,.6);

            border-color:
                rgba(0,0,0,.08);
        }

        .stat-title {
            opacity: .65;
            font-size: 14px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            margin-top: 10px;
        }

        .blue {
            color: #00c6ff;
        }

        .yellow {
            color: #ffc857;
        }

        .green {
            color: #38e38b;
        }

        .red {
            color: #ff6b6b;
        }

        /* TICKETS */

        .tickets-card {
            overflow-x: auto;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;

            margin-bottom: 20px;
        }

        .card-header h2 {
            margin: 0;
            font-size: 19px;
            white-space: nowrap;
        }

        /* FILTERS */

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .filters input,
        .filters select {
            padding: 10px 12px;

            border-radius: 10px;

            border:
                1px solid rgba(255,255,255,.15);

            background:
                rgba(255,255,255,.08);

            color: inherit;

            outline: none;

            transition: .2s;
        }

        .filters input:focus,
        .filters select:focus {
            border-color: #00c6ff;

            box-shadow:
                0 0 0 3px rgba(0,198,255,.10);
        }

        .filters input {
            width: 190px;
        }

        .filters select {
            cursor: pointer;
        }

        .filters select option {
            color: #111;
            background: white;
        }

        body.light .filters input,
        body.light .filters select {
            background:
                rgba(255,255,255,.75);

            border-color:
                rgba(0,0,0,.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th,
        td {
            text-align: left;

            padding: 14px 10px;

            border-bottom:
                1px solid rgba(255,255,255,.08);
        }

        th {
            font-size: 12px;
            opacity: .6;
            text-transform: uppercase;
        }

        td {
            font-size: 14px;
        }

        .ticket-id {
            color: #00c6ff;
            font-weight: bold;
        }

        .priority {
            font-size: 12px;

            padding: 5px 9px;

            border-radius: 15px;
        }

        .priority.High {
            background:
                rgba(255,107,107,.15);

            color: #ff6b6b;
        }

        .priority.Medium {
            background:
                rgba(255,200,87,.15);

            color: #ffc857;
        }

        .priority.Low {
            background:
                rgba(56,227,139,.15);

            color: #38e38b;
        }

        select.status-select {
            padding: 8px;

            border-radius: 9px;

            border:
                1px solid rgba(255,255,255,.15);

            background:
                rgba(255,255,255,.08);

            color: inherit;

            cursor: pointer;
        }

        select.status-select option {
            color: #111;
            background: white;
        }

/* VIEW DETAILS BUTTON */

.view-btn {
    padding: 8px 12px;
    border-radius: 9px;
    border: 1px solid rgba(0,198,255,.25);
    background: rgba(0,198,255,.10);
    color: #00c6ff;
    cursor: pointer;
    font-size: 13px;
    transition: .2s;
}

.view-btn:hover {
    background: rgba(0,198,255,.20);
    transform: translateY(-1px);
}


/* TICKET DETAILS MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;

    background: rgba(0,0,0,.65);

    backdrop-filter: blur(8px);

    align-items: center;
    justify-content: center;

    padding: 20px;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 650px;

    max-height: 90vh;
    overflow-y: auto;

    padding: 25px;

    border-radius: 20px;

    background: rgba(15,30,48,.92);

    border:
        1px solid rgba(255,255,255,.15);

    box-shadow:
        0 25px 70px rgba(0,0,0,.35);
}

body.light .modal-box {
    background: rgba(255,255,255,.95);
    color: #172033;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 15px;

    margin-bottom: 22px;
}

.modal-header h2 {
    margin: 0;
    font-size: 22px;
}

.close-btn {
    width: 38px;
    height: 38px;

    border-radius: 10px;

    border:
        1px solid rgba(255,255,255,.15);

    background:
        rgba(255,255,255,.08);

    color: inherit;

    cursor: pointer;
    font-size: 20px;
}

.detail-grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 14px;
}

.detail-item {
    padding: 14px;

    border-radius: 12px;

    background:
        rgba(255,255,255,.06);

    border:
        1px solid rgba(255,255,255,.08);
}

body.light .detail-item {
    background:
        rgba(0,0,0,.04);

    border-color:
        rgba(0,0,0,.08);
}

.detail-label {
    font-size: 11px;
    opacity: .55;

    text-transform: uppercase;

    margin-bottom: 6px;
}

.detail-value {
    font-size: 14px;
    word-break: break-word;
}

.detail-description {
    margin-top: 12px;
    padding: 12px;

    border-radius: 10px;

    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.08);

    height: auto;
    min-height: 0;

    overflow: visible;

    display: block;
}

.detail-description .detail-label {
    margin: 0 0 8px 0;
    padding: 0;
}

.description-text {
    margin: 0;
    padding: 0;

    font-size: 14px;
    line-height: 1.5;

    white-space: pre-wrap;
    word-break: break-word;

    height: auto;
    min-height: 0;

    overflow: visible;
}

body.light .detail-description {
    background: rgba(0,0,0,.04);
    border-color: rgba(0,0,0,.08);
}
        .reply-history {
    margin-top: 14px;
    padding: 16px;

    border-radius: 12px;

    background:
        rgba(255,255,255,.06);

    border:
        1px solid rgba(255,255,255,.08);

    height: auto;
    overflow: visible;
}

        .reply-box {
    margin-top: 10px;
    padding: 10px 12px;

    border-radius: 10px;

    background: rgba(255,255,255,.05);

    border: 1px solid rgba(255,255,255,.07);

    height: auto;
    min-height: 0;

    overflow: visible;

    display: block;
}

.reply-box > div {
    height: auto;
    min-height: 0;
}

.reply-box div {
    height: auto;
}

body.light .reply-box {
    background: rgba(0,0,0,.04);
    border-color: rgba(0,0,0,.08);
}

.reply-history > .detail-label {
    margin-bottom: 10px;
}

.reply-history > div:not(.detail-label) {
    height: auto;
    min-height: 0;
    overflow: visible;
}

body.light .detail-description {
    background:
        rgba(0,0,0,.04);

    border-color:
        rgba(0,0,0,.08);
}

@media(max-width: 600px) {

    .detail-grid {
        grid-template-columns: 1fr;
    }

}

        /* ADMIN REPLY */

.reply-section {
    margin-top: 20px;
    padding-top: 20px;

    border-top:
        1px solid rgba(255,255,255,.10);
}

.reply-title {
    font-size: 15px;
    font-weight: bold;

    margin-bottom: 10px;
}

.reply-section textarea {
    width: 100%;
    min-height: 60px;
    height: auto;

    resize: none;
    overflow: hidden;

    padding: 8px 12px;

    border:
        1px solid rgba(255,255,255,.15);

    border-radius: 10px;

    background:
        rgba(255,255,255,.07);

    color: inherit;

    outline: none;

    font-family: Arial, sans-serif;
    font-size: 14px;

    line-height: 1.5;

    display: block;
}
.reply-section textarea:focus {
    border-color: #00c6ff;

    box-shadow:
        0 0 0 3px rgba(0,198,255,.10);
}

.reply-btn {
    margin-top: 12px;

    padding: 11px 18px;

    border: none;
    border-radius: 10px;

    background: #00c6ff;
    color: #06101e;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;
}

.reply-btn:hover {
    transform: translateY(-1px);

    box-shadow:
        0 8px 20px rgba(0,198,255,.20);
}

body.light .reply-section textarea {
    background:
        rgba(255,255,255,.8);

    border-color:
        rgba(0,0,0,.10);
}
        
        .empty {
            text-align: center;
            padding: 50px;
            opacity: .65;
        }

        /* RESPONSIVE */

        @media(max-width: 1000px) {

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .card-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .filters {
                width: 100%;
                justify-content: flex-start;
            }

        }

        @media(max-width: 700px) {

            .sidebar {
                width: 80px;
            }

            .logo {
                font-size: 0;
                text-align: center;
            }

            .logo span {
                font-size: 20px;
            }

            .menu a {
                font-size: 0;
                text-align: center;
            }

            .main {
                padding: 18px;
            }

            .filters {
                width: 100%;
            }

            .filters input,
            .filters select {
                width: 100%;
            }

        }

        @media(max-width: 550px) {

            .layout {
                display: block;
            }

            .sidebar {
                width: 100%;

                border-right: none;

                border-bottom:
                    1px solid rgba(255,255,255,.12);
            }

            .menu {
                flex-direction: row;
                overflow-x: auto;
            }

            .menu a {
                white-space: nowrap;
                font-size: 13px;
            }

            .logout {
                margin-top: 0;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .welcome h1 {
                font-size: 22px;
            }

        }

    </style>

</head>


<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>


<div class="layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            HR <span>Admin</span>
        </div>


        <nav class="menu">

            <a
                href="dashboard.html"
                class="active"
            >
                📊 Dashboard
            </a>


            <a href="#tickets">
                🎫 All Tickets
            </a>


            <a href="#">
                👥 Employees
            </a>


            <a href="#">
                📄 HR Policies
            </a>


            <a href="#">
                ⚙️ Settings
            </a>


            <a
                href="#"
                class="logout"
                onclick="logout()"
            >
                🚪 Logout
            </a>

        </nav>

    </aside>


    <!-- MAIN -->

    <main class="main">


        <div class="topbar">

            <div class="welcome">

                <h1>
                    Admin Dashboard 🛠️
                </h1>

                <p>
                    Manage employee HR support tickets.
                </p>

            </div>


            <button
                class="theme-btn"
                id="themeBtn"
                onclick="toggleTheme()"
            >
                ☀️
            </button>

        </div>


        <!-- STATS -->

        <section class="stats">


            <div class="card">

                <div class="stat-title">
                    Total Tickets
                </div>

                <div
                    id="totalTickets"
                    class="stat-number blue"
                >
                    0
                </div>

            </div>


            <div class="card">

                <div class="stat-title">
                    Open
                </div>

                <div
                    id="openTickets"
                    class="stat-number red"
                >
                    0
                </div>

            </div>


            <div class="card">

                <div class="stat-title">
                    Pending
                </div>

                <div
                    id="pendingTickets"
                    class="stat-number yellow"
                >
                    0
                </div>

            </div>


            <div class="card">

                <div class="stat-title">
                    Resolved
                </div>

                <div
                    id="resolvedTickets"
                    class="stat-number green"
                >
                    0
                </div>

            </div>


        </section>


        <!-- ALL TICKETS -->

        <section
            id="tickets"
            class="card tickets-card"
        >


            <div class="card-header">


                <h2>
                    🎫 All Employee Tickets
                </h2>


                <!-- SEARCH + FILTER -->

                <div class="filters">

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="🔍 Search ticket..."
                        oninput="displayTickets()"
                    >


                    <select
                        id="statusFilter"
                        onchange="displayTickets()"
                    >

                        <option value="All">
                            All Status
                        </option>

                        <option value="Open">
                            Open
                        </option>

                        <option value="Pending">
                            Pending
                        </option>

                        <option value="Resolved">
                            Resolved
                        </option>

                    </select>


                    <select
                        id="priorityFilter"
                        onchange="displayTickets()"
                    >

                        <option value="All">
                            All Priority
                        </option>

                        <option value="High">
                            High
                        </option>

                        <option value="Medium">
                            Medium
                        </option>

                        <option value="Low">
                            Low
                        </option>

                    </select>

                </div>

            </div>


            <div id="ticketTable"></div>


        </section>

<!-- TICKET DETAILS MODAL -->

<div
    id="ticketModal"
    class="modal"
    onclick="closeModalOnOutside(event)"
>

    <div
        class="modal-box"
        onclick="event.stopPropagation()"
    >

        <div class="modal-header">

            <h2>
                🎫 Ticket Details
            </h2>

            <button
                class="close-btn"
                onclick="closeTicketModal()"
            >
                ✕
            </button>

        </div>

        <div id="ticketDetails"></div>

<div class="reply-section">

    <div class="reply-title">
        💬 Admin Reply
    </div>

    <textarea
        id="adminReply"
        placeholder="Write your reply to the employee..."
    ></textarea>

    <button
        class="reply-btn"
        onclick="sendAdminReply()"
    >
        📤 Send Reply
    </button>

</div>

    </div>

</div>
        

    </main>

</div>


<script>

    /* ============================
       ADMIN LOGIN CHECK
    ============================ */

    if (
        localStorage.getItem("hr-user-role") !== "admin"
    ) {
        window.location.href = "../index.html";
    }


    /* ============================
       THEME
    ============================ */

    const savedTheme =
        localStorage.getItem("hr-theme");

    if (savedTheme === "light") {

        document.body.classList.add("light");

        document.getElementById("themeBtn").textContent = "🌙";
    }


    function toggleTheme() {

        document.body.classList.toggle("light");

        const isLight =
            document.body.classList.contains("light");

        localStorage.setItem(
            "hr-theme",
            isLight ? "light" : "dark"
        );

        document.getElementById("themeBtn").textContent =
            isLight ? "🌙" : "☀️";
    }


    /* ============================
       LOAD TICKETS
    ============================ */

    function getTickets() {

        return JSON.parse(
            localStorage.getItem("hr-tickets") || "[]"
        );
    }


    /* ============================
       UPDATE STATS
    ============================ */

    function updateStats(tickets) {

        document.getElementById("totalTickets").textContent =
            tickets.length;

        document.getElementById("openTickets").textContent =
            tickets.filter(
                ticket => ticket.status === "Open"
            ).length;

        document.getElementById("pendingTickets").textContent =
            tickets.filter(
                ticket => ticket.status === "Pending"
            ).length;

        document.getElementById("resolvedTickets").textContent =
            tickets.filter(
                ticket => ticket.status === "Resolved"
            ).length;
    }


    /* ============================
       DISPLAY TICKETS
    ============================ */

    function displayTickets() {

        const tickets = getTickets();

        updateStats(tickets);


        const search =
            document
                .getElementById("searchInput")
                .value
                .trim()
                .toLowerCase();


        const status =
            document.getElementById("statusFilter").value;


        const priority =
            document.getElementById("priorityFilter").value;


        /*
            Original ticket index preserve kar rahe hain
            taaki filter ke baad bhi status change sahi ticket par ho.
        */

        const filteredTickets =

            tickets
                .map((ticket, index) => ({
                    ticket: ticket,
                    index: index
                }))

                .filter(item => {

                    const ticket = item.ticket;


                    const searchableText =

                        String(ticket.id || "") +
                        " " +
                        String(ticket.subject || "") +
                        " " +
                        String(ticket.category || "") +
                        " " +
                        String(ticket.description || "");


                    const matchesSearch =
                        searchableText
                            .toLowerCase()
                            .includes(search);


                    const matchesStatus =
                        status === "All" ||
                        ticket.status === status;


                    const matchesPriority =
                        priority === "All" ||
                        ticket.priority === priority;


                    return (
                        matchesSearch &&
                        matchesStatus &&
                        matchesPriority
                    );
                });


        const container =
            document.getElementById("ticketTable");


        /* ============================
           NO RESULTS
        ============================ */

        if (filteredTickets.length === 0) {

            let message =
                "Employee tickets will appear here.";


            if (
                search ||
                status !== "All" ||
                priority !== "All"
            ) {
                message =
                    "Try changing your search or filters.";
            }


            container.innerHTML = `

                <div class="empty">

                    <div style="font-size:50px;">
                        🎫
                    </div>

                    <h3>
                        No tickets found
                    </h3>

                    <p>
                        ${escapeHtml(message)}
                    </p>

                </div>

            `;

            return;
        }


        /* ============================
           TABLE
        ============================ */

        let html = `

            <table>

                <thead>

                    <tr>

                        <th>Ticket</th>

                        <th>Subject</th>

                        <th>Category</th>

                        <th>Priority</th>

                        <th>Created</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody>

        `;


        filteredTickets.forEach(item => {

            const ticket = item.ticket;

            const index = item.index;


            html += `

                <tr>

                    <td>

                        <span class="ticket-id">
                            ${escapeHtml(ticket.id)}
                        </span>

                    </td>


                    <td>
                        ${escapeHtml(ticket.subject)}
                    </td>


                    <td>
                        ${escapeHtml(ticket.category)}
                    </td>


                    <td>

                        <span
                            class="priority ${escapeHtml(ticket.priority)}"
                        >
                            ${escapeHtml(ticket.priority)}
                        </span>

                    </td>


                    <td>
                        ${escapeHtml(ticket.createdAt)}
                    </td>


                    <td>

                        <select
                            class="status-select"
                            onchange="changeStatus(${index}, this.value)"
                        >

                            <option
                                value="Open"
                                ${ticket.status === "Open" ? "selected" : ""}
                            >
                                Open
                            </option>


                            <option
                                value="Pending"
                                ${ticket.status === "Pending" ? "selected" : ""}
                            >
                                Pending
                            </option>


                            <option
                                value="Resolved"
                                ${ticket.status === "Resolved" ? "selected" : ""}
                            >
                                Resolved
                            </option>

                        </select>

                    </td>


                    <td>

                        <button
                            class="view-btn"
                            onclick="viewTicket(${index})"
                        >
                            👁 View
                        </button>

                    </td>

                </tr>

            `;
        });


        html += `

                </tbody>

            </table>

        `;


        container.innerHTML = html;
    }


    /* ============================
       GET ADMIN REPLY HISTORY
    ============================ */

    function getAdminReplies(ticket) {

        /*
            Agar new system ka reply history available hai
            to wahi use hoga.
        */

        if (Array.isArray(ticket.adminReplies)) {

            return ticket.adminReplies;
        }


        /*
            Purane tickets ke liye compatibility.

            Agar ticket me sirf old adminReply hai,
            to usko bhi history me show karenge.
        */

        if (ticket.adminReply) {

            return [
                {
                    text: ticket.adminReply,
                    createdAt: ticket.adminReplyAt || ""
                }
            ];
        }


        return [];
    }


    /* ============================
       VIEW TICKET DETAILS
    ============================ */

    function viewTicket(index) {

        const tickets = getTickets();

        const ticket = tickets[index];


        if (!ticket) {
            return;
        }


        const details =
            document.getElementById("ticketDetails");


        /*
            Current ticket ID save kar rahe hain
            taaki Admin Reply sahi ticket me save ho.
        */

        details.dataset.ticketId = ticket.id;


        /* ============================
           REPLY HISTORY
        ============================ */

        const replies = getAdminReplies(ticket);

        let replyHtml = "";


        if (replies.length > 0) {

            replyHtml = `
    <div class="reply-history">
        <div class="detail-label">💬 Reply History</div>


                    ${replies.map((reply, i) => `

                        <div class="reply-box">

                            <div
                                style="
                                    font-size:12px;
                                    opacity:.6;
                                    margin-bottom:6px;
                                "
                            >
                                Reply #${i + 1}
                            </div>


                            <div
                                style="
                                    white-space:pre-wrap;
                                    line-height:1.6;
                                    height:auto;
                                    overflow:visible;
                                    word-break:break-word;
                                "
                            >
                                ${escapeHtml(reply.text)}
                            </div>


                            ${
                                reply.createdAt
                                ? `
                                    <div
                                        style="
                                            margin-top:8px;
                                            font-size:11px;
                                            opacity:.5;
                                        "
                                    >
                                        🕐 ${escapeHtml(reply.createdAt)}
                                    </div>
                                `
                                : ""
                            }

                        </div>

                    `).join("")}

                </div>

            `;
        }


        /* ============================
           TICKET DETAILS HTML
        ============================ */

        details.innerHTML = `

            <div class="detail-grid">


                <div class="detail-item">

                    <div class="detail-label">
                        Ticket ID
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(ticket.id)}
                    </div>

                </div>


                <div class="detail-item">

                    <div class="detail-label">
                        Status
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(ticket.status)}
                    </div>

                </div>


                <div class="detail-item">

                    <div class="detail-label">
                        Employee
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(ticket.employee || "N/A")}
                    </div>

                </div>


                <div class="detail-item">

                    <div class="detail-label">
                        Email
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(ticket.email || "N/A")}
                    </div>

                </div>


                <div class="detail-item">

                    <div class="detail-label">
                        Category
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(ticket.category)}
                    </div>

                </div>


                <div class="detail-item">

                    <div class="detail-label">
                        Priority
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(ticket.priority)}
                    </div>

                </div>


                <div class="detail-item">

                    <div class="detail-label">
                        Created
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(ticket.createdAt)}
                    </div>

                </div>


                <div class="detail-item">

                    <div class="detail-label">
                        Subject
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(ticket.subject)}
                    </div>

                </div>


            </div>


            <div class="detail-description">

    <div class="detail-label">
        Description
    </div>

    <div class="description-text">${escapeHtml(
        ticket.description ||
        "No description provided."
    )}</div>

</div>


                ${escapeHtml(
                    ticket.description ||
                    "No description provided."
                )}

            </div>


            ${replyHtml}

        `;


        /*
            Har baar ticket open karne par
            reply box ko small size se start karenge.
        */

        const replyBox =
            document.getElementById("adminReply");


        if (replyBox) {

            replyBox.value = "";

            replyBox.style.height = "60px";
        }


        document
            .getElementById("ticketModal")
            .classList.add("show");
    }


    /* ============================
       AUTO RESIZE REPLY BOX
    ============================ */

    function autoResizeReplyBox() {

        const replyBox =
            document.getElementById("adminReply");


        if (!replyBox) {
            return;
        }


        /*
            Pehle height reset.
            Phir actual content ke according
            scrollHeight set.
        */

        replyBox.style.height = "auto";

        replyBox.style.height =
            replyBox.scrollHeight + "px";
    }


    /* ============================
       ADMIN REPLY
    ============================ */

    function sendAdminReply() {

        const replyBox =
            document.getElementById("adminReply");


        const reply =
            replyBox.value.trim();


        if (!reply) {

            alert("Please write a reply first.");

            return;
        }


        /*
            Current ticket ID
        */

        const ticketId =
            document
                .getElementById("ticketDetails")
                .dataset.ticketId;


        if (!ticketId) {

            alert("Ticket not found.");

            return;
        }


        const tickets = getTickets();


        const ticketIndex =
            tickets.findIndex(
                ticket =>
                    String(ticket.id) ===
                    String(ticketId)
            );


        if (ticketIndex === -1) {

            alert("Ticket not found.");

            return;
        }


        /* ============================
           SAVE REPLY
        ============================ */

        const replyTime =
            new Date().toLocaleString();


        /*
            Agar old ticket me adminReplies
            array nahi hai to create karenge.
        */

        if (
            !Array.isArray(
                tickets[ticketIndex].adminReplies
            )
        ) {

            tickets[ticketIndex].adminReplies = [];


            /*
                Purana single reply agar hai,
                to pehle usko history me migrate karenge.
            */

            if (
                tickets[ticketIndex].adminReply
            ) {

                tickets[ticketIndex]
                    .adminReplies
                    .push({

                        text:
                            tickets[ticketIndex]
                                .adminReply,

                        createdAt:
                            tickets[ticketIndex]
                                .adminReplyAt || ""
                    });
            }
        }


        /*
            IMPORTANT:

            Yahan PUSH use ho raha hai.

            Isliye new reply purane reply ko
            overwrite nahi karega.
        */

        tickets[ticketIndex]
            .adminReplies
            .push({

                text: reply,

                createdAt: replyTime
            });


        /*
            Latest reply compatibility ke liye
            separate fields me bhi save kar rahe hain.
        */

        tickets[ticketIndex].adminReply =
            reply;


        tickets[ticketIndex].adminReplyAt =
            replyTime;


        /* ============================
           SAVE TO LOCAL STORAGE
        ============================ */

        localStorage.setItem(
            "hr-tickets",
            JSON.stringify(tickets)
        );


        /* ============================
           CLEAR REPLY BOX
        ============================ */

        replyBox.value = "";

        replyBox.style.height = "60px";
    
        alert("Reply sent successfully!");


        /*
            Details refresh karenge.

            Purana reply + naya reply
            dono history me dikhenge.
        */

        viewTicket(ticketIndex);
    }


    /* ============================
       CLOSE MODAL
    ============================ */

    function closeTicketModal() {

        document
            .getElementById("ticketModal")
            .classList.remove("show");
    }


    /* ============================
       CLOSE OUTSIDE MODAL
    ============================ */

    function closeModalOnOutside(event) {

        if (
            event.target.id === "ticketModal"
        ) {

            closeTicketModal();
        }
    }


    /* ============================
       CHANGE STATUS
    ============================ */

    function changeStatus(
        index,
        newStatus
    ) {

        const tickets = getTickets();


        if (!tickets[index]) {
            return;
        }


        tickets[index].status =
            newStatus;


        localStorage.setItem(
            "hr-tickets",
            JSON.stringify(tickets)
        );


        displayTickets();
    }


    /* ============================
       SECURITY HELPER
    ============================ */

    function escapeHtml(text) {

        const div =
            document.createElement("div");


        div.textContent =
            text ?? "";


        return div.innerHTML;
    }


    /* ============================
       LOGOUT
    ============================ */

    function logout() {

        localStorage.removeItem(
            "hr-user-role"
        );


        window.location.href =
            "../index.html";
    }


    /* ============================
       REPLY BOX INPUT LISTENER
    ============================ */

    document
        .getElementById("adminReply")
        .addEventListener(
            "input",
            autoResizeReplyBox
        );


    /* ============================
       INITIAL LOAD
    ============================ */

    displayTickets();

</script>

</body>

</html>
