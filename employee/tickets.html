<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Tickets | HR Helpdesk</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial,sans-serif;
            color: white;
            background: linear-gradient(
                135deg,
                #07111f,
                #0b2940,
                #06101e
            );
        }

        body.light {
            color: #172033;
            background: linear-gradient(
                135deg,
                #eef7ff,
                #dceeff,
                #f7fbff
            );
        }

        .page {
            max-width: 1100px;
            margin: auto;
            padding: 30px 20px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .back {
            color: #00c6ff;
            text-decoration: none;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 11px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.15);
            background: rgba(255,255,255,.08);
            color: inherit;
            text-decoration: none;
        }

        .primary {
            background: linear-gradient(135deg,#00c6ff,#0072ff);
            color: white;
            border: none;
        }

        .glass {
            padding: 25px;
            border-radius: 20px;
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.14);
            backdrop-filter: blur(20px);
        }

        body.light .glass,
        body.light .btn {
            background: rgba(255,255,255,.6);
            border-color: rgba(0,0,0,.08);
        }

        .ticket {
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,.1);
        }

        .ticket:last-child {
            border-bottom: none;
        }

        .ticket-top {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .ticket h3 {
            margin: 0 0 8px;
        }

        .ticket-id {
            opacity: .6;
            font-size: 13px;
        }

        .details {
            opacity: .75;
            margin: 10px 0;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            background: rgba(0,198,255,.15);
            color: #00c6ff;
            font-size: 12px;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            opacity: .7;
        }

        @media(max-width:600px) {

            .ticket-top {
                display: block;
            }

            .status {
                margin-top: 10px;
            }

        }

    </style>

</head>


<body>

<div class="page">

    <div class="topbar">

        <a
            class="back"
            href="dashboard.html"
        >
            ← Dashboard
        </a>

        <div class="actions">

            <a
                class="btn primary"
                href="new-ticket.html"
            >
                + New Ticket
            </a>

        </div>

    </div>


    <div class="glass">

        <h1>🎫 My Tickets</h1>

        <p>
            View and track your HR support requests.
        </p>

        <div id="ticketsContainer"></div>

    </div>

</div>


<script>

    /* LOGIN CHECK */

    if (localStorage.getItem("hr-user-role") !== "employee") {
        window.location.href = "../index.html";
    }


    function loadTickets() {

        const tickets =
            JSON.parse(
                localStorage.getItem("hr-tickets") || "[]"
            );


        const container =
            document.getElementById("ticketsContainer");


        if (tickets.length === 0) {

            container.innerHTML = `
                <div class="empty">

                    <div style="font-size:50px;">
                        🎫
                    </div>

                    <h2>No tickets yet</h2>

                    <p>
                        You haven't created any HR support tickets.
                    </p>

                    <a
                        class="btn primary"
                        href="new-ticket.html"
                    >
                        Create Your First Ticket
                    </a>

                </div>
            `;

            return;
        }


        container.innerHTML =
            tickets.map(ticket => `

                <div class="ticket">

                    <div class="ticket-top">

                        <div>

                            <h3>
                                ${escapeHtml(ticket.subject)}
                            </h3>

                            <div class="ticket-id">
                                ${ticket.id}
                                •
                                ${ticket.createdAt}
                            </div>

                        </div>

                        <span class="status">
                            ${escapeHtml(ticket.status)}
                        </span>

                    </div>


                    <div class="details">

                        <strong>Category:</strong>
                        ${escapeHtml(ticket.category)}

                        &nbsp; | &nbsp;

                        <strong>Priority:</strong>
                        ${escapeHtml(ticket.priority)}

                    </div>


                    <div>
                        ${escapeHtml(ticket.description)}
                    </div>

                </div>

            `).join("");

    }


    function escapeHtml(text) {

        const div = document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }


    loadTickets();

</script>

</body>
</html>
