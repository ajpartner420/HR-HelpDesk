<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | HR Helpdesk</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(0,198,255,.18), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(36,120,232,.18), transparent 35%),
                linear-gradient(135deg, #07111f, #0b2940, #06101e);
            color: white;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 24px;
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background: linear-gradient(135deg,#2478e8,#00b8e8);
            font-size: 24px;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(0,198,255,.18);
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
            font-size: 25px;
        }

        .subtitle {
            text-align: center;
            opacity: .65;
            margin-bottom: 28px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            opacity: .8;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            margin-bottom: 18px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.12);
            background: rgba(255,255,255,.07);
            color: white;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #00c6ff;
            box-shadow: 0 0 0 3px rgba(0,198,255,.10);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg,#2478e8,#00b8e8);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            opacity: .92;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
            line-height: 1.5;
        }

        .success {
            color: #4ade80;
        }

        .error {
            color: #ff7b7b;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #00c6ff;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">
        HR
    </div>

    <h1>🔐 Create New Password</h1>

    <div class="subtitle">
        Enter your new HR Helpdesk password
    </div>

    <form id="resetForm">

        <label for="password">
            New Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter new password"
            required
        >

        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            required
        >

        <button type="submit">
            Update Password
        </button>

    </form>

    <div id="message"></div>

    <a href="index.html" class="back">
        ← Back to Login
    </a>

</div>

<script>

const SUPABASE_URL =
    "https://rhrsduambtsftirevxma.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_c6cX-qZSCU87RDFBqApG8g_OFTkf3fk";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


document.getElementById("resetForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("message");


    if (password !== confirmPassword) {

        message.className = "error";

        message.textContent =
            "Passwords do not match.";

        return;
    }


    if (password.length < 6) {

        message.className = "error";

        message.textContent =
            "Password must be at least 6 characters.";

        return;
    }


    message.className = "";

    message.textContent =
        "Updating password...";


    const { error } =
        await supabaseClient.auth.updateUser({
            password: password
        });


    if (error) {

        message.className = "error";

        message.textContent =
            error.message;

        return;
    }


    message.className = "success";

    message.textContent =
        "Password updated successfully! Redirecting to login...";


    await supabaseClient.auth.signOut();


    setTimeout(() => {

        window.location.href =
            "index.html";

    }, 2000);

});

</script>

</body>
</html>
